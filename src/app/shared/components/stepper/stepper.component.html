<div class="flex items-start w-full px-8 md:px-12" role="list" aria-label="Etapas do formulário">
  @for (step of steps; track step.id) {
    <div class="flex flex-col items-center w-20" role="listitem" [attr.aria-current]="currentStep() === step.id ? 'step' : null">
      <div
        class="w-10 h-10 rounded-full flex items-center justify-center transition-all duration-300 z-10"
        [class.bg-primary]="currentStep() >= step.id"
        [class.text-white]="currentStep() >= step.id"
        [class.border-2]="currentStep() < step.id"
        [class.border-primary]="currentStep() === step.id"
        [class.border-gray-medium]="currentStep() < step.id"
        [class.text-primary]="currentStep() === step.id"
        [class.text-gray-dark]="currentStep() < step.id"
        [attr.aria-label]="'Passo ' + step.id + ': ' + step.label">
        {{ step.id }}
      </div>
      <p
        class="mt-2 text-xs sm:text-sm font-medium transition-colors duration-300 min-h-10 flex items-start justify-center text-center px-1"
        [class.text-primary]="currentStep() >= step.id"
        [class.text-gray-dark]="currentStep() < step.id">
        {{ step.label }}
      </p>
    </div>

    @if (!$last) {
      <div
        aria-hidden="true"
        class="flex-1 border-t-2 mt-5 transition-colors duration-300"
        [class.border-primary]="currentStep() > step.id"
        [class.border-gray-medium]="currentStep() <= step.id">
      </div>
    }
  }
</div>
